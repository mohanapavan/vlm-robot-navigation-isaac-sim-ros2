# Nav2 parameters for the LIDAR pipeline (slam_lidar.launch.py). Same as nav2_params_camera.yaml except:
#   - bt_navigator reads /chassis/odom (there is no EKF in the lidar pipeline)
#   - the costmaps use the static /map layer (the saved lidar map served by map_server) and NO obstacle layer.
#
# Do not add an ObstacleLayer on /scan to either costmap. With one, the costmap's TF handling stopped after start-up:
#   - global costmap (planner_server): its robot pose froze at the start-up position, so every plan began where the
#     robot *was* when Nav2 started; from anywhere else the controller saw a plan 3+ m away and aborted with
#     "Resulting plan has 0 poses in it" (goals only worked near the start-up position);
#   - local costmap (controller_server): it kept only the first map->odom sample ("Transform data too old when
#     converting from map to odom"), and Nav2 then reported "Reached the goal!" instantly whenever the robot stood
#     at the map origin.
# The camera pipeline never had an obstacle layer, which is why it never showed this.

# Inflation 0.9 m (was 0.5), scaling 2.5 (was 3.0), both costmaps: the inscribed radius is unchanged, so no gap becomes
# impassable, but plans keep to the middle of open floor. Found on the live stack: with 0.5 m the plan from the chair_1
# stand-off hugged the chair 0.51 m from the mapped cells, and the chair's low base (below the 2-D lidar plane, so not on
# the map) held the robot; with 0.9 m the same plan is 0.3 m longer and stays at least 0.77 m from every mapped obstacle.

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      # PoseProgressChecker also counts turning: a robot that has to rotate in place for more than 10 s (to leave a spot
      # it is facing out of, or to face the object) is making progress, which SimpleProgressChecker cannot see.
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.5
      required_movement_angle: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.4
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      max_angular_accel: 3.2
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.3
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /chassis/odom

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [-0.5, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.35
      resolution: 0.05
      update_frequency: 1.0
      publish_frequency: 1.0
      rolling_window: false
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        subscribe_to_updates: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.9

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      robot_radius: 0.35
      resolution: 0.05
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 5
      height: 5
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        subscribe_to_updates: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.9
